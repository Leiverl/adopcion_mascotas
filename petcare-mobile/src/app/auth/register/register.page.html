<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/welcome"></ion-back-button>
    </ion-buttons>
    <ion-title>Crear Cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
    <ion-item>
      <ion-input label="Nombre completo" labelPlacement="floating" type="text" formControlName="nombre" errorText="El nombre es requerido"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Correo Electrónico" labelPlacement="floating" type="email" formControlName="correo" errorText="Correo inválido"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Contraseña" labelPlacement="floating" type="password" formControlName="contrasena" errorText="Mínimo 8 caracteres"></ion-input>
    </ion-item>

    <ion-button expand="block" shape="round" type="submit" class="ion-margin-top" [disabled]="registerForm.invalid">
      Registrarse
    </ion-button>

    <div class="ion-text-center ion-margin-top">
      <a routerLink="/login">¿Ya tienes una cuenta? Inicia Sesión</a>
    </div>
  </form>
</ion-content>
