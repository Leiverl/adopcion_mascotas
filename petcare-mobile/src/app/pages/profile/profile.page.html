<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Mi Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Mi Perfil</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list [inset]="true">
    <ion-item [button]="true" [routerLink]="['/tabs/profile/applications']" detail="true">
      <ion-icon slot="start" name="document-text-outline"></ion-icon>
      <ion-label>Mis Solicitudes de Adopción</ion-label>
    </ion-item>

    <ion-item [button]="true" [routerLink]="['/tabs/profile/my-events']" detail="true">
      <ion-icon slot="start" name="star-outline"></ion-icon>
      <ion-label>Mis Eventos</ion-label>
    </ion-item>

    <ion-item [button]="true" [routerLink]="['/tabs/profile/edit']" detail="true">
      <ion-icon slot="start" name="person-circle-outline"></ion-icon>
      <ion-label>Editar Perfil</ion-label>
    </ion-item>
  </ion-list>
  
  <ion-list [inset]="true">
    <ion-item [button]="true" (click)="logout()" color="danger">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      <ion-label>Cerrar Sesión</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
