<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/profile"></ion-back-button>
    </ion-buttons>
    <ion-title>Editar Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
    <ion-item>
      <ion-input label="Nombre Completo" labelPlacement="floating" formControlName="nombre"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Correo (no editable)" labelPlacement="floating" formControlName="correo"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Nueva Contraseña" labelPlacement="floating" type="password" formControlName="contrasena" 
                 helperText="Dejar en blanco para no cambiar"></ion-input>
    </ion-item>
    <ion-button expand="block" shape="round" type="submit" class="ion-margin-top" [disabled]="profileForm.invalid">
      Guardar Cambios
    </ion-button>
  </form>
</ion-content>
