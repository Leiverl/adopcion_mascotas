<mat-card>
  <mat-card-header>
    <mat-card-title>Gestión de Mascotas</mat-card-title>
    <span class="spacer"></span>
    <button mat-raised-button color="primary" routerLink="/mascotas/new">
      <mat-icon>add</mat-icon>
      Crear Mascota
    </button>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="mascotas" class="mat-elevation-z8">

      <ng-container matColumnDef="foto">
        <th mat-header-cell *matHeaderCellDef> Foto </th>
        <td mat-cell *matCellDef="let mascota">
          <img [src]="mascota.galeriaFotos[0] || 'https://via.placeholder.com/40'" alt="Foto de {{mascota.nombre}}" class="pet-avatar">
        </td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let mascota"> {{mascota.nombre}} </td>
      </ng-container>

      <ng-container matColumnDef="especie">
        <th mat-header-cell *matHeaderCellDef> Especie </th>
        <td mat-cell *matCellDef="let mascota"> {{mascota.especie}} </td>
      </ng-container>

      <ng-container matColumnDef="raza">
        <th mat-header-cell *matHeaderCellDef> Raza </th>
        <td mat-cell *matCellDef="let mascota"> {{mascota.raza}} </td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let mascota"> {{mascota.estado}} </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
  <th mat-header-cell *matHeaderCellDef> Acciones </th>
  <td mat-cell *matCellDef="let mascota">
    <button mat-icon-button color="primary" matTooltip="Editar Mascota" (click)="onEdit(mascota._id)">
      <mat-icon>edit</mat-icon>
    </button>
    <button mat-icon-button color="warn" matTooltip="Eliminar Mascota" (click)="onDelete(mascota._id, mascota.nombre)">
      <mat-icon>delete</mat-icon>
    </button>
  </td>
</ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
