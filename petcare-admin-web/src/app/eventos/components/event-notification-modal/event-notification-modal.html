<h2 mat-dialog-title>Notificar a Interesados</h2>
<p mat-dialog-subtitle>Enviar un mensaje a todos los usuarios interesados en "{{ event.titulo }}"</p>

<mat-dialog-content>
  <form [formGroup]="notificationForm">
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Título de la Notificación</mat-label>
      <input matInput formControlName="titulo">
    </mat-form-field>
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Mensaje</mat-label>
      <textarea matInput formControlName="cuerpo" rows="5"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="notificationForm.invalid" (click)="onSend()">Enviar</button>
</mat-dialog-actions>
