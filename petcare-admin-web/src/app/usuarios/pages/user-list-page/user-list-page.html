<mat-card>
  <mat-card-header>
    <mat-card-title>Gestión de Usuarios</mat-card-title>
    <span class="spacer"></span>
    <button mat-raised-button color="primary" routerLink="/usuarios/new">
      <mat-icon>add</mat-icon>
      Crear Usuario
    </button>
  </mat-card-header>
  <mat-card-content>
    @if (isLoading) {
      <div class="spinner-container">
        <mat-spinner></mat-spinner>
      </div>
    } @else {
      <div class="table-container mat-elevation-z8">
        <table mat-table [dataSource]="usuarios">

          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef> Nombre </th>
            <td mat-cell *matCellDef="let usuario"> {{usuario.nombre}} </td>
          </ng-container>

          <ng-container matColumnDef="correo">
            <th mat-header-cell *matHeaderCellDef> Correo Electrónico </th>
            <td mat-cell *matCellDef="let usuario"> {{usuario.correo}} </td>
          </ng-container>
          
          <ng-container matColumnDef="rol">
            <th mat-header-cell *matHeaderCellDef> Rol </th>
            <td mat-cell *matCellDef="let usuario"> {{usuario.rol}} </td>
          </ng-container>

          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef> Acciones </th>
            <td mat-cell *matCellDef="let usuario">
              <button mat-icon-button color="primary" matTooltip="Editar Usuario" (click)="onEdit(usuario._id)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" matTooltip="Eliminar Usuario" (click)="onDelete(usuario._id, usuario.nombre)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    }
  </mat-card-content>
</mat-card>
